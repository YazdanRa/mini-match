version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "swift"
    directory: "/apps/apple/MiniMatch"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
