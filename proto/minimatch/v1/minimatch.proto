syntax = "proto3";

package minimatch.v1;

option go_package = "github.com/YazdanRa/mini-match/services/api/gen/minimatch/v1;minimatchv1";
option java_multiple_files = true;
option java_package = "app.minimatch.api.v1";
option swift_prefix = "MM";

service MiniMatchService {
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  rpc JoinTable(JoinTableRequest) returns (JoinTableResponse);
  rpc LeaveTable(LeaveTableRequest) returns (LeaveTableResponse);
  rpc LockPick(LockPickRequest) returns (LockPickResponse);
  // Deprecated reveal alias retained for wire compatibility.
  rpc StartRound(StartRoundRequest) returns (StartRoundResponse) {
    option deprecated = true;
  }
  // Opens the next server-numbered round from the lobby.
  rpc BeginRound(BeginRoundRequest) returns (BeginRoundResponse);
  // Reveals the named round and returns the table to the lobby.
  rpc RevealRound(RevealRoundRequest) returns (RevealRoundResponse);
  rpc GetTable(GetTableRequest) returns (GetTableResponse);
  rpc GetDailyGlobalTable(GetDailyGlobalTableRequest) returns (GetDailyGlobalTableResponse);
  rpc LockDailyGlobalPick(LockDailyGlobalPickRequest) returns (LockDailyGlobalPickResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
}

message CreateTableRequest {
  string name = 1;
  string host_display_name = 2;
  string host_avatar = 3;
  GameCenterIdentity game_center_identity = 4;
  string join_code = 5;
}

message CreateTableResponse {
  Table table = 1;
  string player_id = 2;
}

message JoinTableRequest {
  string join_code = 1;
  string display_name = 2;
  string avatar = 3;
  GameCenterIdentity game_center_identity = 4;
}

message GameCenterIdentity {
  string team_player_id = 1;
  string public_key_url = 2;
  bytes signature = 3;
  bytes salt = 4;
  uint64 timestamp = 5;
}

message JoinTableResponse {
  Table table = 1;
  string player_id = 2;
}

message LeaveTableRequest {
  string table_id = 1;
  string player_id = 2;
}

message LeaveTableResponse {
  Table table = 1;
}

message LockPickRequest {
  string table_id = 1;
  string player_id = 2;
  Pick pick = 3;
  uint32 round_number = 4;
}

message LockPickResponse {
  Table table = 1;
}

message StartRoundRequest {
  string table_id = 1;
  string host_player_id = 2;
  uint32 round_number = 3;
}

message StartRoundResponse {
  Table table = 1;
}

message BeginRoundRequest {
  string table_id = 1;
  string host_player_id = 2;
}

message BeginRoundResponse {
  Table table = 1;
}

message RevealRoundRequest {
  string table_id = 1;
  string host_player_id = 2;
  uint32 round_number = 3;
}

message RevealRoundResponse {
  Table table = 1;
}

message GetTableRequest {
  string table_id = 1;
}

message GetTableResponse {
  Table table = 1;
}

message GetDailyGlobalTableRequest {
  // Required. Fresh Game Center identity proof for the authenticated player.
  GameCenterIdentity game_center_identity = 1;
}

message LockDailyGlobalPickRequest {
  // Server-issued UTC date used as a stale-screen concurrency token.
  string round_date = 1;
  Pick pick = 2;
  // Required. Fresh Game Center identity proof for the authenticated player.
  GameCenterIdentity game_center_identity = 3;
}

message GetDailyGlobalTableResponse {
  uint64 server_time_unix_seconds = 1;
  DailyGlobalRound current_round = 2;
  DailyGlobalResult previous_result = 3;
  uint64 local_player_daily_wins = 4;
}

message LockDailyGlobalPickResponse {
  uint64 server_time_unix_seconds = 1;
  DailyGlobalRound current_round = 2;
  DailyGlobalResult previous_result = 3;
  uint64 local_player_daily_wins = 4;
}

message DailyGlobalRound {
  string round_date = 1;
  uint64 closes_at_unix_seconds = 2;
  // Present only when the authenticated player has locked a pick.
  Pick local_pick = 3;
}

message DailyGlobalResult {
  string round_date = 1;
  DailyGlobalResultStatus status = 2;
  uint64 participant_count = 3;
  // Present only when this round has a unique winner.
  Pick winning_pick = 4;
  // Present only when the authenticated player entered this round.
  Pick local_pick = 5;
}

enum DailyGlobalResultStatus {
  DAILY_GLOBAL_RESULT_STATUS_UNSPECIFIED = 0;
  DAILY_GLOBAL_RESULT_STATUS_CALCULATING = 1;
  DAILY_GLOBAL_RESULT_STATUS_EMPTY = 2;
  DAILY_GLOBAL_RESULT_STATUS_INSUFFICIENT_PLAYERS = 3;
  DAILY_GLOBAL_RESULT_STATUS_NO_UNIQUE_PICK = 4;
  DAILY_GLOBAL_RESULT_STATUS_WINNER = 5;
}

message DeleteProfileRequest {}

message DeleteProfileResponse {}

message Table {
  string id = 1;
  string name = 2;
  string join_code = 3;
  string host_player_id = 4;
  repeated Player players = 5;
  TableState state = 6;
  // Absent while everyone is waiting in the lobby.
  Round current_round = 7;
  // Present only after reveal; unrevealed picks never appear in Table.
  RoundResult last_result = 8;
  // Deprecated: rounds are independent and tables no longer have a winning score.
  uint32 wins_to_finish = 9 [deprecated = true];
  // Monotonic revision for ordering safe table snapshots.
  uint64 state_version = 10;
  // Monotonic cursor of the latest safe event projected to Firestore.
  uint64 event_sequence = 11;
  // Deprecated: tables no longer finish; use last_result.winner_player_id.
  optional string winner_player_id = 12 [deprecated = true];
  // Deprecated: completed-match totals are no longer reported.
  optional uint64 winner_lifetime_wins = 13 [deprecated = true];
}

message Player {
  string id = 1;
  string display_name = 2;
  // Rounds won by this player at this table.
  uint32 wins = 3;
  bool locked = 4;
  string avatar = 5;
}

message Round {
  uint32 number = 1;
  RoundPhase phase = 2;
}

message RoundResult {
  uint32 round_number = 1;
  repeated Selection selections = 2;
  optional string winner_player_id = 3;
  // Deprecated: exact private counters are no longer returned to table participants.
  uint64 winner_total_wins = 4 [deprecated = true];
  uint32 winner_win_streak = 5 [deprecated = true];
  uint32 winner_best_win_streak = 6 [deprecated = true];
  // Satisfied lifetime/streak achievement identifiers, without exposing exact counters.
  repeated string winner_achievement_ids = 7;
  // Present only when the authenticated player won, for Game Center leaderboard reporting.
  optional uint64 local_player_leaderboard_score = 8;
}

message Selection {
  string player_id = 1;
  Pick pick = 2;
  // Snapshot captured at reveal so completed results survive player departure.
  string display_name = 3;
  // Table win count captured at reveal for the same reason.
  optional uint32 wins = 4;
}

// Picks must be positive; the server rejects zero.
message Pick {
  uint64 value = 1;
}

enum TableState {
  TABLE_STATE_UNSPECIFIED = 0;
  TABLE_STATE_ACTIVE = 1;
  TABLE_STATE_FINISHED = 2 [deprecated = true];
}

enum RoundPhase {
  ROUND_PHASE_UNSPECIFIED = 0;
  ROUND_PHASE_ACCEPTING_PICKS = 1;
  ROUND_PHASE_READY_TO_REVEAL = 2;
}
